services:
  user-service:
    image: 820942898763.dkr.ecr.ap-south-1.amazonaws.com/user-service:${IMAGE_TAG:-latest}
    container_name: user-service
    restart: always
    expose:
      - "3000"
    networks:
      - microservices-network

  product-service:
    image: 820942898763.dkr.ecr.ap-south-1.amazonaws.com/product-service:${IMAGE_TAG:-latest}
    container_name: product-service
    restart: always
    expose:
      - "3000"
    networks:
      - microservices-network

  order-service:
    image: 820942898763.dkr.ecr.ap-south-1.amazonaws.com/order-service:${IMAGE_TAG:-latest}
    container_name: order-service
    restart: always
    expose:
      - "3000"
    networks:
      - microservices-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge
