
services:
  user-service:
    image: 820942898763.dkr.ecr.ap-south-1.amazonaws.com/user-service:${IMAGE_TAG:-latest}
    container_name: user-service
    restart: always
    expose:
      - "3000"
    networks:
      - microservices-network

  product-service:
    image: 820942898763.dkr.ecr.ap-south-1.amazonaws.com/product-service:${IMAGE_TAG:-latest}
    container_name: product-service
    restart: always
    expose:
      - "3000"
    networks:
      - microservices-network

  order-service:
    image: 820942898763.dkr.ecr.ap-south-1.amazonaws.com/order-service:${IMAGE_TAG:-latest}
    container_name: order-service
    restart: always
    expose:
      - "3000"
    networks:
      - microservices-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - microservices-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - microservices-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - microservices-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - microservices-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

